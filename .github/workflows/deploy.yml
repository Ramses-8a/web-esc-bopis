# Nombre del workflow
name: Deploy to Server

# Se ejecuta al hacer un "push" a la rama "main"
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Clona tu repositorio en la máquina virtual
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Sube los archivos al servidor
      - name: Deploy files via SFTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          # Protocolo a usar (sftp es más seguro que ftp)
          protocol: sftp
          # Puerto (usualmente 22 para SFTP)
          port: 22
          # Credenciales del servidor (tomadas de los secrets)
          server: ${{ secrets.SFTP_SERVER }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          
          # Ruta en tu servidor donde se subirán los archivos.
          # ¡¡¡IMPORTANTE: CAMBIA ESTA RUTA!!!
          remote-path: /ruta/a/tu/proyecto/en/el/servidor/

          # --- LA SOLUCIÓN MÁGICA ESTÁ AQUÍ ---
          # Opciones extra para la conexión SFTP
          sftp-options: >
            -o KexAlgorithms=+diffie-hellman-group-exchange-sha256